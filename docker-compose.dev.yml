# Development mode: mount source files into the containers for live reload.
services:
  backend:
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000 --workers 1 --reload
    volumes:
      - ./backend:/app/backend
      - chainguard_data:/data

  frontend:
    command: npm run dev -- --host 0.0.0.0
    environment:
      CHAINGUARD_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
