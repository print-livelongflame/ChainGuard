services:
  detector:
    build:
      context: ${DETECTOR_PATH:-../ChainGuard-detector-template}
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "9000"
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:-}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - type: bind
        source: ${DETECTOR_PATH:-../ChainGuard-detector-template}
        target: /app
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    environment:
      CHAINGUARD_USER_USERNAME: user
      CHAINGUARD_USER_PASSWORD: ChainGuardUser123!
      CHAINGUARD_ADMIN_USERNAME: admin
      CHAINGUARD_ADMIN_PASSWORD: ChainGuard123!
      CHAINGUARD_AI_PROVIDER: ${CHAINGUARD_AI_PROVIDER:-openai}
      CHAINGUARD_DETECTOR_CONFIG_PATH: /data/detector_config.json
      CHAINGUARD_DETECTOR_DEFAULT_ENABLED: "true"
      CHAINGUARD_DETECTOR_DEFAULT_NAME: ChainGuard Local Detector
      CHAINGUARD_DETECTOR_DEFAULT_ENDPOINT: http://detector:9000/detect
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chainguard_data:/data
      - type: bind
        source: ./backend/api_keys
        target: /app/backend/api_keys
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    environment:
      CHAINGUARD_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chainguard_data:
